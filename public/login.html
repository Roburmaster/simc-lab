<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>Sign in · SimC Lab</title><link rel="stylesheet" href="/style.css"></head>
<body class="login-page">
<main class="login-box panel">
<a class="brand" href="/"><span class="brand-mark">S<span>≋</span></span><span>SIMC <b>LAB</b><small>by mpcombat</small></span></a>
<section id="login-start">
<h1>Sign in</h1>
<p class="hint">Sign in with your Discord account. The first time, you also need an invite key from your group. The app only learns your Discord name and avatar.</p>
<p id="login-error" class="notice" hidden></p>
<a class="button primary discord-button" href="/auth/discord">Sign in with Discord <span>→</span></a>
</section>
<form id="invite-form" hidden>
<h1>Invite key</h1>
<p class="hint" id="invite-help">Welcome! Enter the invite key you were given to join. You only need it once.</p>
<label>Invite key<input id="invite-key" autocomplete="off" required maxlength="100"></label>
<p id="invite-error" class="notice" hidden></p>
<button class="button primary" id="invite-submit">Join <span>→</span></button>
<p class="hint"><a href="/login">Cancel</a></p>
</form>
</main>
<script type="module" src="/login.js"></script></body></html>
