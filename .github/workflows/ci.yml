name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: a pull request from a fork can run the tests but cannot write anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs so a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test dependencies (Lua parser and VM for the addon tests)
        run: npm ci
      # SimC installation and live-data tests run locally on the user's PC.
      - name: App and addon tests (no SimC installation)
        run: npm run test:ci
      - name: Installer builds
        working-directory: desktop
        run: |
          npm ci
          node build.mjs
