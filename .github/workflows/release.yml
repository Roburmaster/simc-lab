name: Release

# A release starts from a version tag (v1.2.3). Only the repository owner may create those tags,
# and the release environment waits for the owner's approval before anything is published.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Tag must match package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Install SimC and game data
        run: npm run install-engine
      - name: Unit tests
        run: npm test
      - name: Build the installer
        working-directory: desktop
        run: |
          npm ci
          node build.mjs
      # One upload of all three files: the installer, its blockmap (for small differential updates) and
      # latest.yml, which installed apps read to find the new version.
      - name: Publish the GitHub release
        working-directory: desktop/dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" SimC-Lab-Setup.exe SimC-Lab-Setup.exe.blockmap latest.yml --verify-tag --title "SimC Lab ${{ github.ref_name }}" --generate-notes
